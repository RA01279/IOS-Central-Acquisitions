# Typecheck and the repo-only tests on every push and pull request.
# Tests that need a real Supabase project or a downloaded bundle are skipped
# by scripts/run-tests.mjs (listed there).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
